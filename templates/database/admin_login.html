{% extends "database/base.html" %}
{% block title %}Administrator sign in · CollegeHub{% endblock %}
{% block content %}
<section class="page-hero">
  <div class="container">
    <div class="eyebrow">DATABASE ADMINISTRATION</div>
    <h1>Administrator <em>sign in</em></h1>
    <p>Access is enabled only when the deployment has an administrator password hash and a configured session secret.</p>
    <form method="post" action="{{ url_for('admin_login_submit') }}" class="search-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="admin-password">Password</label>
      <input id="admin-password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
