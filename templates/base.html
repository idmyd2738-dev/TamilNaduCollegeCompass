<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="Explore Tamil Nadu colleges and admission information with CollegeHub.">
  <meta name="theme-color" content="#552b6f">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="CollegeHub home">
    <span class="brand-mark" aria-hidden="true">C</span><span class="brand-name">CollegeHub</span>
  </a>
  <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav">
    <span></span><span></span><span></span>
  </button>
  <nav class="nav-links" id="primaryNav" aria-label="Main navigation">
    <a href="/">Home</a>
    <a href="/college">College</a>
    <a href="/chat">Chatbot</a>
    <a class="nav-login" href="/login">Login</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer">
  <div class="footer-main">
    <a class="brand footer-brand" href="/" aria-label="CollegeHub home"><span class="brand-mark" aria-hidden="true">C</span><span class="brand-name">CollegeHub</span></a>
    <p>College exploration and admission guidance prototype.</p>
    <a class="footer-about" href="/about">About this demo</a>
  </div>
  <div class="footer-meta"><span>© CollegeHub</span><span>Sample information is not official admission advice.</span></div>
</footer>
<script src="{{ url_for('static', filename='js/site.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
